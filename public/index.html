<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Join UI is shown inside the Meal Plan panel only -->
    <!-- Stage Slider -->
    <nav class="nav-links" id="stage-slider" tag="selectable">
        <div id="Book" class="stage-selector active">
            Cook Book
        </div>
        <div id="Plan" class="stage-selector">
            Meal Plan
        </div>
        <div id="Shop" class="stage-selector">
            Shopping List
        </div>
    </nav>

    <div class="panel-window">
        <div class="panel-slider">
            <div class="panel glass hero" id="book-panel">
                <div class="cta-button" id="new-recipe-btn">
                    <span>Create Recipe</span>
                    <img src="./icons/plus.png" class="icon-button">
                </div>
                <div class="recipe-list scrollable-list" id="recipe-list"></div>
            </div>
            <div class="panel glass hero" id="plan-panel">
                    <div id="mealplan-join-ui" style="display:flex;gap:12px;align-items:center;padding:8px;margin-bottom:12px;">
                        <label id="mealplan-label" for="mealplan-code-input" style="color:#fff;font-weight:600;min-width:160px;">Plan: (not joined)</label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <input type="text" id="mealplan-code-input" placeholder="Enter mealplan codeword" style="padding:6px;" />
                            <button id="join-mealplan-btn" class="cta-button"><span>Join</span></button>
                            <button id="leave-mealplan-btn" class="cta-button small-cta" style="display:none;"><span>Leave</span></button>
                        </div>
                    </div>
                    <div class="meal-plan scrollable-list" id="meal-plan"></div>
                    <div style="margin-top:12px;display:flex;justify-content:center;" id="random-recipe-container">
                        <div class="cta-button" id="random-recipe-btn">
                            <span>Random Recipe</span>
                            <img src="./icons/random.png" class="icon-button">
                        </div>
                    </div>
            </div>
            <div class="panel glass hero" id="shop-panel">
                <div class="shopping-list scrollable-list" id="shopping-list"></div>
            </div>
        </div>
    </div>

    <footer class="footer-links">
        <a href="https://github.com/A-Mc-F/RecipeBookWebpage/issues">GitHub Project (Post issues here)</a>
    </footer>

    <div class="modal" id="recipe-form">
        <div class="panel glass hero">
            <button class="close-modal" aria-label="Close"
                style="position:absolute;top:16px;right:16px;background:none;border:none;font-size:1.5rem;cursor:pointer;">&#10005;</button>
            <form style="display:flex;flex-direction:column;gap:1rem;">
                <label for="recipe-name">Name:</label>
                <input type="text" id="recipe-name" name="recipe-name">
                <label for="import-url">Import from URL:</label>
                <div style="display:flex;gap:8px;align-items:center;">
                    <input type="url" id="import-url" name="import-url" placeholder="https://example.com/recipe" style="flex:1;padding:6px;" />
                    <button id="import-btn" class="cta-button small-cta" type="button"><span>Import</span></button>
                    <button id="import-add-btn" class="cta-button small-cta" type="button"><span>Import & Add</span></button>
                </div>
                <label for="recipe-ingredients">Ingredients:</label>
                <textarea id="recipe-ingredients" name="recipe-ingredients"></textarea>
                <label for="recipe-instructions">Instructions:</label>
                <textarea id="recipe-instructions" name="recipe-instructions"></textarea>
                <div class="cta-button" id="done-btn">
                    <span>Done</span>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="random-choice-modal">
        <div class="panel glass hero" style="max-width:900px;padding:20px;position:relative;">
            <button class="close-modal" id="random-modal-close" aria-label="Close"
                style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:1.5rem;cursor:pointer;color:#fff;">&#10005;</button>
            <h2 style="color:white;margin-bottom:12px;text-align:center;">Choose a recipe</h2>
            <div id="random-choice-container" style="display:flex;gap:16px;justify-content:center;flex-wrap:wrap;padding:8px;">
                <!-- Two random recipe choice cards will be injected here -->
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>

</body>

</html>
